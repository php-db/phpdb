extends = "vendor/php-db/phpdb-qa-tools/mago.toml"
php-version = "8.3.0"

[source]
paths = ["src", "test"]
includes = ["vendor"]

[formatter]
parentheses-around-new-in-member-access = true

[linter]
baseline = "lint-baseline.toml"

[linter.rules]
# Exception classes are message catalogues: one template and one named constructor per
# condition, per the convention in docs/book/exceptions.md. The method count tracks the
# number of distinct failures a component can report, so the maintainability signal does
# not apply. Predicate, AlterTable, CreateTable, Select, Insert and Update are fluent builders:
# one public method per clause they can emit, so their method count is the size of their
# public API. AbstractSql is their base and carries one protected hook per clause it renders.
# "test/" repeats the phpdb-qa-tools default, which this key replaces.
too-many-methods = { exclude = [
    "test/",
    "src/Sql/Exception/",
    "src/Sql/Predicate/Exception/",
    "src/TableGateway/Exception/",
    "src/Adapter/Exception/",
    "src/Sql/Predicate/Predicate.php",
    "src/Sql/Ddl/AlterTable.php",
    "src/Sql/Ddl/CreateTable.php",
    "src/Sql/AbstractSql.php",
    "src/Sql/Select.php",
    "src/Sql/Insert.php",
    "src/Sql/Update.php",
] }

# Select holds one property per clause of a SELECT statement.
too-many-properties = { exclude = ["src/Sql/Select.php"] }

# These constructors take one argument per part of the SQL definition they model
# (a foreign key's name, columns, reference table, reference columns and two rules; a
# column's name, digits, scale, nullability, default and options). They are public API, so
# the list cannot be shortened without breaking callers.
excessive-parameter-list = { exclude = [
    "src/Sql/Ddl/Constraint/ForeignKey.php",
    "src/Sql/Ddl/Column/AbstractPrecisionColumn.php",
] }

# The capability interfaces return `ResultSetInterface&<themselves>`, and PHP rejects
# `self` as part of an intersection type, so this rule's advice cannot be taken there.
prefer-self-return-type = { exclude = [
    "src/ResultSet/ArrayObjectResultSetInterface.php",
    "src/ResultSet/HydratingResultSetInterface.php",
    "src/ResultSet/RowPrototypeResultSetInterface.php",
] }

[analyzer]
baseline = "analyzer-baseline.toml"
# ArgumentType is string-backed and each case's value is a ::class constant, which PHP accepts
# as a string. The analyzer reports the class-string type as not being a string.
ignore = [
    { code = "invalid-enum-case-value", in = ["src/Sql/ArgumentType.php"] },
]
class-initializers = [
    "PhpDb\\ResultSet\\AbstractResultSet::initialize",
    "PhpDb\\TableGateway\\Feature\\AbstractFeature::setTableGateway",
    "PhpDb\\RowGateway\\Feature\\AbstractFeature::setRowGateway",
]

# Guard keeps the library's layering from eroding. From the bottom up: Exception and Feature,
# then Adapter and ResultSet, Sql, Metadata, RowGateway, TableGateway, and finally Container and
# ConfigProvider, which wire everything together. Restrictions forbid only the upward dependencies
# named below, so everything else stays allowed. Two known exceptions are permitted on purpose:
# Adapter\Platform reaches into Sql\Platform for its decorator interfaces, and Adapter and ResultSet
# depend on each other. Tests may depend on anything, so they are not guarded.
[guard]
excludes = ["test/"]

[[guard.perimeter.restrictions]]
dependency = "PhpDb\\Container\\"
allow-from = ["PhpDb", "PhpDb\\Container\\"]
reason = "Container factories wire the library together; nothing else may depend on them."

[[guard.perimeter.restrictions]]
dependency = "PhpDb\\TableGateway\\"
allow-from = ["PhpDb\\TableGateway\\", "PhpDb\\Container\\"]
reason = "TableGateway is the outermost layer."

[[guard.perimeter.restrictions]]
dependency = "PhpDb\\RowGateway\\"
allow-from = ["PhpDb\\RowGateway\\", "PhpDb\\TableGateway\\", "PhpDb\\Container\\"]
reason = "Only the gateways and container wiring may use RowGateway."

[[guard.perimeter.restrictions]]
dependency = "PhpDb\\Metadata\\"
allow-from = ["PhpDb\\Metadata\\", "PhpDb\\TableGateway\\", "PhpDb\\Container\\"]
reason = "Metadata builds on Sql and Adapter, not the other way round."

[[guard.perimeter.restrictions]]
dependency = "PhpDb\\Sql\\"
allow-from = [
    "PhpDb\\Sql\\",
    "PhpDb\\Metadata\\",
    "PhpDb\\RowGateway\\",
    "PhpDb\\TableGateway\\",
    "PhpDb\\Container\\",
    "PhpDb\\Adapter\\Platform\\",
    "PhpDb",
]
reason = "Sql sits above Adapter; only the platforms' decorator hooks may reach back into it."

[[guard.structural.rules]]
on = "PhpDb\\**\\Exception\\**"
target = "class"
must-be-named = "*Exception"
reason = "Exception classes are named *Exception."

[[guard.structural.rules]]
on = "PhpDb\\**"
target = "interface"
must-be-named = "*Interface"
reason = "Interfaces follow the *Interface naming convention."

[[guard.structural.rules]]
on = "PhpDb\\Container\\**"
target = "class"
must-be-named = "*Factory"
not-on = "PhpDb\\Container\\AdapterInterfaceDelegator"
reason = "Container classes are service factories."
